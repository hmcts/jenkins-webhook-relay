name: build_and_push
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      AZURE_CONTAINER_REGISTRY_URL: hmctspublic.azurecr.io
      NEW_AZURE_CONTAINER_REGISTRY_URL: hmctsprod.azurecr.io
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@main

    - name: 'Az CLI login'
      uses: azure/login@v2
      with:
        client-id: c6a3a50b-762f-4b4f-b7ec-f1d84be20cef # DTS Platform Operations GitHub Actions ACR Publisher 1
        tenant-id: 531ff96d-0ae9-462a-8d2d-bec7c0b42082 # HMCTS.NET
        allow-no-subscriptions: true

    - name: Generate build ID
      id: prep
      run: |
        sha=${GITHUB_SHA::8}
        ts=$(date +%s)
        echo "BUILD_ID=${sha}-${ts}" >> $GITHUB_OUTPUT

    ###################################################
    # HMCTSPROD ACR
    ###################################################
    - name: 'ACR Login - ${{ env.NEW_AZURE_CONTAINER_REGISTRY_URL }}'
      run: |
        az acr login --name hmctsprod

    - name: 'Build and Push PR image - ${{ env.NEW_AZURE_CONTAINER_REGISTRY_URL }}'
      if: startsWith(github.ref, 'refs/pull')
      run: |
        docker build . -t hmctsprod.azurecr.io/jenkins/jenkins-webhook-relay:pr-${{github.event.number}}-${{ steps.prep.outputs.BUILD_ID }}
        docker push hmctsprod.azurecr.io/jenkins/jenkins-webhook-relay:pr-${{github.event.number}}-${{ steps.prep.outputs.BUILD_ID }}

    - name: 'Build and Push Prod image - ${{ env.NEW_AZURE_CONTAINER_REGISTRY_URL }}'
      if: github.ref == 'refs/heads/master'
      run: |
        docker build . -t hmctsprod.azurecr.io/jenkins/jenkins-webhook-relay:prod-${{ steps.prep.outputs.BUILD_ID }}
        docker push hmctsprod.azurecr.io/jenkins/jenkins-webhook-relay:prod-${{ steps.prep.outputs.BUILD_ID }}

    ###################################################
    # HMCTSPUBLIC ACR - Push
    ###################################################
    - name: 'ACR Login - ${{ env.AZURE_CONTAINER_REGISTRY_URL }}'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.AZURE_CONTAINER_REGISTRY_URL }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: 'Build and Push PR image - ${{ env.AZURE_CONTAINER_REGISTRY_URL }}'
      if: startsWith(github.ref, 'refs/pull')
      run: |
        docker build . -t ${{ env.AZURE_CONTAINER_REGISTRY_URL }}/jenkins/jenkins-webhook-relay:pr-${{github.event.number}}-${{ steps.prep.outputs.BUILD_ID }}
        docker push ${{ env.AZURE_CONTAINER_REGISTRY_URL }}/jenkins/jenkins-webhook-relay:pr-${{github.event.number}}-${{ steps.prep.outputs.BUILD_ID }}

    - name: 'Build and Push Prod image - ${{ env.AZURE_CONTAINER_REGISTRY_URL }}'
      if: github.ref == 'refs/heads/master'
      run: |
        docker build . -t ${{ env.AZURE_CONTAINER_REGISTRY_URL }}/jenkins/jenkins-webhook-relay:prod-${{ steps.prep.outputs.BUILD_ID }}
        docker push ${{ env.AZURE_CONTAINER_REGISTRY_URL }}/jenkins/jenkins-webhook-relay:prod-${{ steps.prep.outputs.BUILD_ID }}
